name: Playwright Tests

on:
  push:
    branches:
      - main
      - master

jobs:
  Executetest:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      url: ${{ vars.URL }}
      apiurl: ${{ vars.APIURL }}
      validUserName: ${{ secrets.VALIDUSERNAME }}
      validPassword: ${{ secrets.VALIDPASSWORD }}
      invalidUserName: ${{ secrets.INVALIDUSERNAME }}
      USERNAME_ADMIN: ${{ secrets.USERNAME_ADMIN }}
      USER_ADMIN_PASSWORD: ${{ secrets.USER_ADMIN_PASSWORD }}

    steps:
      # Step 1: Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Install Playwright and necessary browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Step 5: Run Playwright tests
      - name: Run Playwright tests
        run: npm run ci.test

      # Step 6: Generate the Allure report
      - name: Generate Allure report
        run: npx allure generate --single-file ./allure-results --clean -o ./allure-report

      # Step 7: Upload test results as artifact (even on failure)
      - name: Upload Playwright test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: ./allure-report/
          retention-days: 30